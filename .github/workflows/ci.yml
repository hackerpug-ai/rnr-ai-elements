name: ci

# ORI-CI-003 — credential-free candidate checks.
#
# Four jobs: typecheck, lint, registry, docs-build. docs-build runs only after all
# three prerequisites succeed. This lane takes no secrets, needs nothing beyond
# contents: read, and pins every action to a verified full commit SHA:
#   actions/checkout       11bd71901bbe5b1630ceea73d27597364c9af683 (v4.2.2)
#   actions/setup-node     49933ea5288caeca8642d1e84afbd3f7d6820020 (v4.4.0)
#   pnpm/action-setup      a7487c7e89a18df4991f7f222e4898a00d66ddda (v4.1.0)
#   actions/upload-artifact ea165f8d65b6e75b540449e92b4886f43607fa02 (v4.6.2)
#
# It provides pull-request feedback only. The complete test, native, provider and
# publication acceptance obligations stay with ORI-CI-004's protected workflow,
# which calls this workflow at its exact candidate revision via workflow_call.
#
# No absence-success guards: a candidate missing package.json or
# scripts.registry:build fails the jobs that need them — the real commands fail,
# scaffold notices never turn into success.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_call:
    inputs:
      candidate_sha:
        description: >-
          Exact 40-hex candidate revision the caller accepts. Every job refuses to
          execute any other checked-out SHA.
        type: string
        required: true

permissions:
  contents: read

# workflow + event + ref: automatic runs for the same PR or branch supersede each
# other, while a workflow_call run never shares a group with an automatic run of
# the same ref — a protected caller can never cancel, or be cancelled by, its own
# callee. A cancelled run can never qualify as acceptance (ORI-CI-004).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify candidate identity
        if: github.event_name == 'workflow_call'
        env:
          DECLARED_CANDIDATE: ${{ inputs.candidate_sha }}
          CHECKED_OUT_SHA: ${{ github.sha }}
        run: |
          if [ "${#DECLARED_CANDIDATE}" -eq 40 ] \
            && [ -z "$(printf '%s' "$DECLARED_CANDIDATE" | tr -d '0-9a-f')" ] \
            && [ "$DECLARED_CANDIDATE" = "$CHECKED_OUT_SHA" ]; then
            echo "candidate identity verified: $CHECKED_OUT_SHA"
          else
            echo "::error::refusing to run: declared candidate '$DECLARED_CANDIDATE' is not the 40-hex checked-out revision '$CHECKED_OUT_SHA'"
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The root typecheck graph imports apps/docs/src/data/registry-items.json, a
      # gitignored generated file (sprint-04's contract test). A clean checkout has
      # no such file, so the data is generated here before the compilers run — from
      # the committed public/r tree; this never repairs or accepts registry drift
      # (the registry job owns freshness).
      - name: Generate gitignored docs data the typecheck graph imports
        run: |
          set -eo pipefail
          pnpm gallery:manifest 2>&1 | tee -a typecheck.log
          pnpm --filter @rnr-ai-elements/docs run prebuild 2>&1 | tee -a typecheck.log
      - name: Compilers (live-chat import graph + root workspace)
        run: |
          set -eo pipefail
          pnpm --dir apps/example exec tsc --noEmit -p tsconfig.live-chat.json 2>&1 | tee typecheck.log
          pnpm typecheck 2>&1 | tee -a typecheck.log
      - name: Upload typecheck evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typecheck-log
          path: typecheck.log
          retention-days: 7
          if-no-files-found: error

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify candidate identity
        if: github.event_name == 'workflow_call'
        env:
          DECLARED_CANDIDATE: ${{ inputs.candidate_sha }}
          CHECKED_OUT_SHA: ${{ github.sha }}
        run: |
          if [ "${#DECLARED_CANDIDATE}" -eq 40 ] \
            && [ -z "$(printf '%s' "$DECLARED_CANDIDATE" | tr -d '0-9a-f')" ] \
            && [ "$DECLARED_CANDIDATE" = "$CHECKED_OUT_SHA" ]; then
            echo "candidate identity verified: $CHECKED_OUT_SHA"
          else
            echo "::error::refusing to run: declared candidate '$DECLARED_CANDIDATE' is not the 40-hex checked-out revision '$CHECKED_OUT_SHA'"
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint commands (biome, tokens, styling contract)
        run: |
          set -eo pipefail
          pnpm lint 2>&1 | tee lint.log
          pnpm check:tokens 2>&1 | tee -a lint.log
          pnpm check:contract 2>&1 | tee -a lint.log
      - name: Upload lint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-log
          path: lint.log
          retention-days: 7
          if-no-files-found: error

  registry:
    name: registry
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify candidate identity
        if: github.event_name == 'workflow_call'
        env:
          DECLARED_CANDIDATE: ${{ inputs.candidate_sha }}
          CHECKED_OUT_SHA: ${{ github.sha }}
        run: |
          if [ "${#DECLARED_CANDIDATE}" -eq 40 ] \
            && [ -z "$(printf '%s' "$DECLARED_CANDIDATE" | tr -d '0-9a-f')" ] \
            && [ "$DECLARED_CANDIDATE" = "$CHECKED_OUT_SHA" ]; then
            echo "candidate identity verified: $CHECKED_OUT_SHA"
          else
            echo "::error::refusing to run: declared candidate '$DECLARED_CANDIDATE' is not the 40-hex checked-out revision '$CHECKED_OUT_SHA'"
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The deliverable is a copy-paste registry: public/r/*.json must stay in sync
      # with the component sources. Fresh generation must leave the tree clean —
      # tracked drift (stale committed output) AND untracked generated output (a
      # regenerated-but-uncommitted item) both fail. Generation never silently
      # repairs an uncommitted release.
      - name: Fresh generation and freshness proof
        run: |
          set -eo pipefail
          pnpm registry:build 2>&1 | tee registry.log
          drift="$(git status --porcelain -- public/r)"
          if [ -n "$drift" ]; then
            {
              echo '::error::public/r is not fresh — tracked drift or untracked generated output after registry:build'
              echo 'Drift entries:'
              printf '%s\n' "$drift"
            } | tee -a registry.log
            exit 1
          fi
          echo 'public/r fresh: no tracked drift, no untracked generated output' | tee -a registry.log
      - name: Upload registry evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-log
          path: registry.log
          retention-days: 7
          if-no-files-found: error

  docs-build:
    name: docs-build
    needs: [typecheck, lint, registry]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify candidate identity
        if: github.event_name == 'workflow_call'
        env:
          DECLARED_CANDIDATE: ${{ inputs.candidate_sha }}
          CHECKED_OUT_SHA: ${{ github.sha }}
        run: |
          if [ "${#DECLARED_CANDIDATE}" -eq 40 ] \
            && [ -z "$(printf '%s' "$DECLARED_CANDIDATE" | tr -d '0-9a-f')" ] \
            && [ "$DECLARED_CANDIDATE" = "$CHECKED_OUT_SHA" ]; then
            echo "candidate identity verified: $CHECKED_OUT_SHA"
          else
            echo "::error::refusing to run: declared candidate '$DECLARED_CANDIDATE' is not the 40-hex checked-out revision '$CHECKED_OUT_SHA'"
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Verbatim docs build after prerequisite success. Invalid authored content
      # fails here for real — no continue-on-error, no diagnostic upload masking.
      - name: Docs build
        run: |
          set -eo pipefail
          pnpm --filter @rnr-ai-elements/docs build 2>&1 | tee docs-build.log
          dist_count="$(find apps/docs/dist -type f | wc -l | tr -d ' ')"
          dist_digest="$(find apps/docs/dist -type f -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)"
          echo "apps/docs/dist: $dist_count files, sha256-of-manifest $dist_digest" | tee -a docs-build.log
          if [ "$dist_count" -eq 0 ]; then
            echo '::error::docs build produced an empty dist'
            exit 1
          fi
      - name: Upload docs dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-dist
          path: apps/docs/dist
          retention-days: 1
          if-no-files-found: error
      - name: Upload docs-build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-build-log
          path: docs-build.log
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: deploy
    needs: [registry, typecheck, lint, docs-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment: production
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download docs dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-dist
          path: apps/docs/dist
      - name: Preflight dist
        run: pnpm exec tsx scripts/docs-deploy/preflight-dist.ts --dist apps/docs/dist
      - name: Preflight edge
        run: pnpm exec tsx scripts/docs-deploy/preflight-edge.ts --dist apps/docs/dist --require-www-redirect
      - name: Deploy docs
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          wranglerVersion: '4.81.0'
          workingDirectory: apps/docs
          command: deploy --message ${{ github.sha }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke registry JSON
        run: curl --fail --silent --show-error https://rnraielements.com/r/nativewind/conversation.json
